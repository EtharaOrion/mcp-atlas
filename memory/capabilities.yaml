# memory/capabilities.yaml
# Per-project opt-in capability block for the yuji harness submodule
# ENGRAM harness.
# Per trinity/ENGRAM.md Phase 0 step 8a, Phase 0 step 8b, and Phase G
# step 9, which seeds this block at the default posture so a fresh
# submodule ships with every deferred ENGRAM capability declared at
# default and a backlog the human can read.
#
# The default posture is fixed:
#   - Model identity rests on provider signatures, registry attestations,
#     and transcript hashes verified against memory/roots.yaml.
#   - Ledger integrity rests on the signed Merkle checkpoint log plus the
#     recovery procedure.
#
# A project MAY pin a stronger posture by flipping a capability from
# default to declared, then to implemented once its defining bytes are
# on disk. A declared capability with no byte-level definition is
# decorative and never raises a disposition. A claimed-implemented
# capability whose bytes are absent, or one that would silently fall
# back to the weaker default, caps the ledger at BROKEN.
#
# This block is part of the bound bytes at Phase 0.5 of a run whose
# parent root is this submodule. No such run has occurred, so no
# approval binds these bytes yet. Any state flip re-triggers scope
# sign-off for that run.

schema_version: 1

project:
  name: yuji-harness-submodule
  role: harness
  parent_project: yuji
  submodule_path: harness/
  upstream_identity: github.com/EtharaOrion/mcp-atlas
  scaffolded_by: trinity/ENGRAM.md Phase G step 9
  scaffolded_at: "2026-08-24T18:05:00Z"
  scaffold_note: >-
    Phase G step 9 scaffolds only the memory/ harness into a submodule. It
    seeds this capability block and the generated TODO.md and nothing else.
    No ledger surface, no scope, and no approval is scaffolded here, because
    each of those is the output of a run rather than a part of the harness.

capabilities:
  - id: identity_attestation
    state: default
    definition_ref: null
    notes: >-
      Model identity via provider signatures, registry attestations,
      and transcript hashes verified against memory/roots.yaml. A
      project MAY pin a stronger identity-attestation policy by
      declaring the capability and giving it an objective byte-level
      definition here.
  - id: witness_network
    state: default
    definition_ref: null
    notes: >-
      Multi-operator witness network for the checkpoint log. Deferred
      behind the signed Merkle checkpoint plus recovery procedure. A
      project MAY enable a witness network by declaring the capability
      and pinning the operator set here.
  - id: contamination
    state: default
    definition_ref: null
    notes: >-
      Cross-task contamination against a bound training-corpus snapshot.
      ENGRAM would name the corpus snapshot, pin its digest, and bind
      it as the single derivation root both peers audit against per
      Phase 1 step 8b. Currently at default posture: no corpus snapshot
      is bound.
  - id: orthogonality
    state: default
    definition_ref: null
    notes: >-
      Fitting hardness-catalog orthogonality groups from signed pilot
      outcomes per Phase H step 8. Until implemented, groups are authored
      priors and no fitted estimate ever promotes a row. This submodule
      carries no hardness catalog, so the capability is inert here as
      well as unimplemented.
  - id: autonomous_gates
    state: default
    definition_ref: null
    notes: >-
      Discharge of digest gates by a signed out-of-band approver per
      invariant E33. At default posture every gate stays human. The first
      flip to implemented must itself be human-signed, because an autonomy
      grant the autonomous party writes is a self-attestation loop.

# bucket_d_status is generated by the harness self-test from the
# filesystem and the Phase 2 conformance result. It is never
# hand-maintained. Drift between this block and the harness modules
# fails closed. The block is part of the bound bytes at Phase 0.5.
#
# Every required Bucket-D instrument scaffolds at bytes_present: true
# (the module file exists), implemented: false (the accepting path
# raises NotImplementedError), and liveness_proven: false (Phase 2
# has never run against this submodule as parent root). This is the
# honest-scaffold case that first-runs STALE and never BROKEN per
# Phase 2 step 8. An instrument honestly reporting implemented: false
# is a coverage gap, never inert theater.

bucket_d_status:
  - instrument: ingestor
    module: engram/ingestor.py
    bytes_present: true
    implemented: false
    liveness_proven: false
  - instrument: verifier
    module: engram/verifier.py
    bytes_present: true
    implemented: false
    liveness_proven: false
  - instrument: freshener
    module: engram/freshener.py
    bytes_present: true
    implemented: false
    liveness_proven: false
  - instrument: checkpointer
    module: engram/checkpointer.py
    bytes_present: true
    implemented: false
    liveness_proven: false
  - instrument: recovery
    module: engram/recovery.py
    bytes_present: true
    implemented: false
    liveness_proven: false
  - instrument: provenance
    module: engram/provenance.py
    bytes_present: true
    implemented: false
    liveness_proven: false
