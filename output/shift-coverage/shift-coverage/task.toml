schema_version = "1.3"

[task]
name = "mcp-atlas/shift-coverage"
description = "A warehouse operations lead needs the April night-shift rota audited for certification compliance."
keywords = ["mcp", "tool-use", "agentic"]

[metadata]
category = "mcp-tool-use"
task_id = "shift-coverage"
image = "ghcr.io/scaleapi/mcp-atlas:1.2.7"
source = "ScaleAI/MCP-Atlas"

[agent]
timeout_sec = 1800

[environment]
cpus = 4
memory_mb = 10240
storage_mb = 10240
network_mode = "public"

# The mcp-atlas image speaks a bespoke REST API, not MCP (see
# adapters/mcp_atlas/mcp_rest_bridge.py). The agent therefore talks to a
# stdio bridge running in its own container, which proxies to the sidecar.
[[environment.mcp_servers]]
name = "mcp-atlas"
transport = "stdio"
command = "uv"
args = ["run", "--no-project", "/opt/mcp-bridge/mcp_rest_bridge.py"]

# Gate the agent launch until the sandbox sidecar has finished starting its
# MCP servers. Without this the agent connects to a bridge whose upstream
# isn't up yet and runs with zero tools.
[environment.healthcheck]
command = "curl -sf --max-time 10 http://mcp-server:1984/health | grep -q health_and_client_connection_ok"
interval_sec = 5
timeout_sec = 15
start_period_sec = 180
retries = 36

[environment.env]
MCP_SERVER_URL = "http://mcp-server:1984"
ENABLED_TOOLS_FILE = "/enabled_tools.txt"

[verifier]
timeout_sec = 900.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-}"
# tests/agent_judge.py drives claude-agent-sdk, which shells out to the
# `claude` CLI. Forwarding the subscription token lets the verifier bill a
# Claude Code plan instead of metered API credits -- the same auth path
# Harbor's own claude-code agent uses. Without this the judge has no
# credentials on a subscription-only run and every task scores 0.
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
LITELLM_API_KEY = "${LITELLM_API_KEY:-}"
LITELLM_BASE_URL = "${LITELLM_BASE_URL:-}"
JUDGE_MODEL = "claude-sonnet-4-6"

[[artifacts]]
source = "/data/outputs"
destination = "agent_outputs"
service = "mcp-server"
