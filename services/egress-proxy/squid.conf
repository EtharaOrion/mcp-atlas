# The gatekeeper. Everything the agent container sends outward arrives here,
# and only the hosts named below leave.
#
# WHY A PROXY AND NOT A HARBOR SETTING
#
# Harbor's network_mode has two usable positions on the docker provider and
# neither is what a closed-world task needs:
#
#   public       no overlay at all -- full egress, the agent can read the web
#   no-network   services.main.network_mode: none -- a whole-namespace detach.
#                main leaves the compose bridge, so light-servers goes with it,
#                the agent starts with ZERO MCP tools, and the run grades 0.
#   allowlist    rejected at construction; the docker provider leaves
#                network_allowlist unset, so it defaults False.
#
# network_mode is about whether the container has a network. This file is about
# where that network may go. They are different axes, and only the second one
# is the question a closed-world task is asking.
#
# So network_mode stays "public" and the isolation happens one layer down, in
# compose: overlay.yaml makes the project's default network `internal: true`,
# which strips main and light-servers of any route off the bridge, and puts
# this proxy alone on a second network that does have one. The agent cannot
# opt out by unsetting HTTPS_PROXY, because there is no longer a route to
# unset it toward.
#
# ALLOWLIST
#
# Kept deliberately tiny. Add a host here only after seeing it denied in
# access.log -- never widen to `http_access allow all` to unblock a run.
#
# Peer definition: scripts/detect_internet_use.py's INTERNAL_HOSTS is the same
# idea applied to the trajectory after the fact. That set covers the hosts that
# never leave the bridge (light-servers, localhost, main); this file covers the
# one host that is allowed to. Change one, look at the other.

acl allowed_hosts dstdomain api.anthropic.com

# CONNECT carries the hostname in the clear, so TLS is filtered by name without
# interception. No certificate is generated, injected, or trusted anywhere.
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports allowed_hosts
http_access allow allowed_hosts
http_access deny all

http_port 3128

# A denial must be legible: the run is about to fail a network call and the
# operator needs the hostname, not a generic 403.
#
# NOT /dev/stdout. Squid drops privileges to the 'proxy' user before opening its
# logs and cannot open the container's stdout, dying with "FATAL: Cannot open
# '/dev/stdout' for writing" -- which presents as a proxy that never becomes
# healthy, i.e. as a network outage from inside main. entrypoint.sh tails this
# file so `docker logs` still shows denials.
access_log stdio:/var/log/squid/access.log squid

# No caching. A benchmark that replays a cached response is not reproducing the
# run it claims to reproduce.
cache deny all
cache_store_log none

# Do not leak the internal client address upstream.
forwarded_for delete

# Required, despite -N: the container healthcheck is `squid -k check`, which
# locates the running instance through this file and dies with
# "FATAL: no pid_filename configured" without it. A proxy stuck unhealthy blocks
# main's depends_on and reads like a network outage, so this line is load-bearing.
pid_filename /var/run/squid/squid.pid

shutdown_lifetime 1 second
