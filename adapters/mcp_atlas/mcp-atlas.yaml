adapter: mcp-atlas
tasks_dir: tasks/

agent:
  type: oracle
  timeout_sec: 1800

parity:
  agent_import_path: "adapters.mcp_atlas.mcp_atlas_parity_agent:MCPAtlasParityAgent"
  model: claude-sonnet-4-6
  max_turns: 50
  concurrency: 5
  timeout_sec: 1800

verifier:
  timeout_sec: 900
  judge_model: claude-sonnet-4-6
  pass_threshold: 0.5

environment:
  image: ghcr.io/scaleapi/mcp-atlas:1.2.7
  cpus: 4
  memory_mb: 10240
  storage_mb: 10240
