name: python tests

# The adapter, the scoring modules and the Harbor bundle shape had no CI at
# all: `make test` only ran the agent-environment pin-sync suite, so a broken
# adapter (no MCP servers, no tool allowlist, no `main` service) shipped
# undetected. This workflow runs every non-Docker Python suite plus the
# end-to-end smoke test.

on:
  pull_request:
    paths:
      - "adapters/**"
      - "services/scoring/**"
      - "services/mcp_eval/**"
      - "scripts/smoke_test.py"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "adapters/**"
      - "services/scoring/**"
      - "services/mcp_eval/**"
      - "scripts/smoke_test.py"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/python-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what a bare macOS `python3` resolves to and caught a real
        # event-loop bug; 3.12 is what the bundles and Harbor CLI run on.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Unit tests
        run: python -m pytest adapters services/scoring/tests services/mcp_eval/tests -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Smoke test
        # Exercises bundle generation, Harbor schema validation, a live MCP
        # handshake through the REST bridge, and the oracle trajectory.
        run: python scripts/smoke_test.py
